plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Shared multiloader sources: common code compiles against Mojmap on both loaders.
sourceSets.main.java.srcDirs += '../common/src/main/java'
sourceSets.main.resources.srcDirs += '../common/src/main/resources'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from('../LICENSE')
}
