plugins {
    id 'net.neoforged.moddev'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

neoForge {
    version = project.neoforge_version

    runs {
        server {
            server()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Shared multiloader sources: common code compiles against Mojmap on both loaders.
sourceSets.main.java.srcDirs += '../common/src/main/java'
sourceSets.main.resources.srcDirs += '../common/src/main/resources'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Keep neoforge.mods.toml version in sync with gradle.properties.
tasks.processResources {
    inputs.property 'version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.mod_version
    }
}

jar {
    from('../LICENSE')
}
